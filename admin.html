<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<title>Wesley & Dionne | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#c5a059;--gold-dark:#9e7a37;--cream:#faf8f3;--white:#fff;--text:#2c2925;--muted:#6e675f;--red:#b33a3a;--green:#55795d;--line:rgba(197,160,89,.28)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--cream);color:var(--text);font-family:Montserrat,sans-serif;min-height:100vh;padding:14px}.hidden{display:none!important}button,input{font:inherit}.shell{max-width:1050px;margin:auto}.login{max-width:430px;margin:7vh auto 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}.script{font-family:'Alex Brush',cursive;color:var(--gold-dark);font-size:3rem}.label{font-size:.7rem;letter-spacing:.13em;font-weight:800;color:var(--muted)}.input{width:100%;border:1px solid rgba(158,122,55,.6);border-radius:10px;padding:12px;text-align:center;margin-top:16px;outline:0}.btn{border:0;border-radius:999px;padding:10px 17px;min-height:41px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;font-weight:700;cursor:pointer}.btn.small{font-size:.75rem;padding:8px 12px;min-height:35px}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.dark{background:#292725}.btn.outline{background:#fff;color:var(--muted);border:1px solid #aaa}.btn:disabled{opacity:.45}.error{color:var(--red);font-size:.78rem;margin-top:8px;min-height:1em}.top{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 7px 25px rgba(0,0,0,.05)}.brand{display:flex;gap:12px;align-items:center}.mini-xi{color:#8a1c1c;font-size:1.7rem}.title{font-weight:800}.sub{font-size:.72rem;color:var(--muted);margin-top:3px}.actionsTop{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center}.stat strong{display:block;color:var(--gold-dark);font-size:1.5rem}.stat span{font-size:.7rem;color:var(--muted);font-weight:700}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.tab.active{background:var(--gold-dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:35px;text-align:center;color:var(--muted)}.memory{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.045)}.thumb{position:relative;width:100%;aspect-ratio:9/16;background:#111;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .processing{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.52);padding:20px;text-align:center;font-size:.8rem}.body{padding:13px}.guestrow{display:flex;justify-content:space-between;gap:8px}.guest{font-weight:800}.token{font-size:.7rem;color:var(--gold-dark);font-weight:800}.meta{font-size:.7rem;color:var(--muted);line-height:1.5;margin-top:5px}.captioncopy{font-size:.75rem;margin-top:8px;padding:8px;background:#f8f6f1;border-radius:8px}.rowbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.order{display:flex;gap:5px;align-items:center;margin-top:8px}.order span{font-size:.68rem;color:var(--muted)}.tokenpanel{margin:13px 0;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}.tokenpanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tokenpanel input{width:85px;border:1px solid #bbb;border-radius:8px;padding:8px;text-transform:uppercase}.tokenstats{font-size:.75rem;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center}.playerWrap{position:relative;height:min(94vh,900px);aspect-ratio:9/16;max-width:100vw;background:#000;overflow:hidden}.playerWrap video{width:100%;height:100%;object-fit:cover;display:block}.playerbar{position:fixed;z-index:120;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.counter,.close{pointer-events:auto;background:rgba(0,0,0,.58);color:#fff;border:0;border-radius:999px}.counter{padding:9px 13px;font-size:.75rem;font-weight:800}.close{width:43px;height:43px;cursor:pointer;font-size:1.1rem}.dragging{opacity:.45}
@media(max-width:600px){body{padding:10px}.top{align-items:flex-start;flex-direction:column}.actionsTop{justify-content:flex-start}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:6px}.stat{padding:11px}}
</style>
</head>
<body>
<div class="shell">
<section id="login" class="login"><div class="script">Wesley & Dionne</div><div class="label">WEDDING ADMIN</div><input id="adminCode" class="input" type="password" placeholder="ADMIN PASSWORD" autocomplete="current-password"><button id="loginBtn" class="btn" style="margin-top:12px">Enter Admin</button><div id="loginError" class="error"></div></section>
<section id="app" class="hidden">
<header class="top"><div class="brand"><div class="mini-xi">囍</div><div><div class="label">ADMIN · VIDEO QUEUE</div><div class="title">Wesley & Dionne</div><div class="sub">Real shared moderation queue</div></div></div><div class="actionsTop"><button id="refresh" class="btn outline small">↻ Refresh</button><button id="play" class="btn dark small">▶ Play Approved Queue</button></div></header>
<div class="stats"><div class="stat"><strong id="pendingStat">0</strong><span>Pending</span></div><div class="stat"><strong id="approvedStat">0</strong><span>Approved</span></div><div class="stat"><strong id="processingStat">0</strong><span>Processing</span></div><div class="stat"><strong id="totalStat">0</strong><span>Total</span></div></div>
<div class="tokenpanel"><div class="row"><button id="generate300" class="btn small">Generate 300 Guest Codes</button><button id="downloadCodes" class="btn outline small hidden">Download Last Codes CSV</button><input id="resetCode" maxlength="4" placeholder="CODE"><button id="resetToken" class="btn outline small">Reset Code</button></div><div id="tokenStats" class="tokenstats">Token statistics will appear here.</div></div>
<div class="tabs"><button class="tab active" data-tab="pending">Pending</button><button class="tab" data-tab="approved">Approved</button><button class="tab" data-tab="processing">Processing</button><button class="tab" data-tab="all">All</button></div>
<main id="grid" class="grid"></main>
</section>
</div>
<section id="player" class="modal hidden"><div class="playerbar"><div id="counter" class="counter"></div><button id="close" class="close">✕</button></div><div class="playerWrap"><video id="queueVideo" playsinline controls preload="metadata"></video></div></section>
<script type="module">
import Hls from "https://cdn.jsdelivr.net/npm/hls.js@1.6.13/+esm";

const API_BASE='https://YOUR-WORKER.workers.dev';
const $=id=>document.getElementById(id);
const S={adminTicket:sessionStorage.getItem('wd_admin_ticket')||'',items:[],tab:'pending',lastCodes:[],drag:null,queue:[],qi:0,hls:null};
function configured(){if(API_BASE.includes('YOUR-WORKER'))throw new Error('Set API_BASE to your deployed Worker URL first.')}
async function api(path,options={}){configured();const headers=new Headers(options.headers||{});if(S.adminTicket)headers.set('Authorization',`Bearer ${S.adminTicket}`);if(options.body&&!(options.body instanceof FormData)&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');const r=await fetch(API_BASE+path,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function bytes(n){if(!n)return'—';const u=['B','KB','MB','GB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(i?1:0)+' '+u[i]}
function date(n){return new Date(n).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function duration(x){return Math.max(0,(+x.endTime||0)-(+x.startTime||0))}
function statusProcessing(x){return ['uploading','processing_source','processing_clip'].includes(x.status)}

$('loginBtn').onclick=login;$('adminCode').onkeydown=e=>{if(e.key==='Enter')login()};
async function login(){try{$('loginError').textContent='';const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('adminCode').value})});S.adminTicket=d.ticket;sessionStorage.setItem('wd_admin_ticket',S.adminTicket);showApp()}catch(e){$('loginError').textContent=e.message}}
async function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}
if(S.adminTicket){showApp().catch(()=>{S.adminTicket='';sessionStorage.removeItem('wd_admin_ticket')})}

$('refresh').onclick=refresh;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;render()});
async function refresh(){const d=await api('/api/admin/submissions');S.items=d.submissions||[];await loadTokenStats();render()}
async function loadTokenStats(){try{const d=await api('/api/admin/tokens');const m=Object.fromEntries((d.stats||[]).map(x=>[x.status,Number(x.count)]));$('tokenStats').textContent=`Codes — available: ${m.available||0} · reserved: ${m.reserved||0} · used: ${m.used||0}`}catch{}}
function stats(){$('pendingStat').textContent=S.items.filter(x=>x.status==='pending').length;$('approvedStat').textContent=S.items.filter(x=>x.status==='approved').length;$('processingStat').textContent=S.items.filter(statusProcessing).length;$('totalStat').textContent=S.items.length;$('play').disabled=!S.items.some(x=>x.status==='approved')}
function visible(){if(S.tab==='all')return [...S.items].sort((a,b)=>b.createdAt-a.createdAt);if(S.tab==='processing')return S.items.filter(statusProcessing).sort((a,b)=>a.createdAt-b.createdAt);if(S.tab==='approved')return S.items.filter(x=>x.status==='approved').sort((a,b)=>(a.sortOrder??99999)-(b.sortOrder??99999)||a.createdAt-b.createdAt);return S.items.filter(x=>x.status==='pending').sort((a,b)=>a.createdAt-b.createdAt)}
function button(text,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=fn;return b}
function render(){stats();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===S.tab));const g=$('grid'),items=visible(),approved=S.items.filter(x=>x.status==='approved').sort((a,b)=>(a.sortOrder??99999)-(b.sortOrder??99999));g.innerHTML='';if(!items.length){g.innerHTML='<div class="empty">Nothing here yet.</div>';return}items.forEach(item=>g.appendChild(card(item,approved)))}
function card(item,approved){const c=document.createElement('article');c.className='memory';c.dataset.id=item.id;if(S.tab==='approved'){c.draggable=true;c.ondragstart=()=>{S.drag=item.id;c.classList.add('dragging')};c.ondragend=()=>{S.drag=null;c.classList.remove('dragging')};c.ondragover=e=>e.preventDefault();c.ondrop=async e=>{e.preventDefault();if(!S.drag||S.drag===item.id)return;const arr=[...approved],from=arr.findIndex(x=>x.id===S.drag),to=arr.findIndex(x=>x.id===item.id);if(from<0||to<0)return;const [m]=arr.splice(from,1);arr.splice(to,0,m);await api('/api/admin/reorder',{method:'POST',body:JSON.stringify({ids:arr.map(x=>x.id)})});await refresh()}}
 const thumb=document.createElement('div');thumb.className='thumb';if(item.thumbnailUrl){const img=document.createElement('img');img.src=item.thumbnailUrl;img.alt='Video thumbnail';thumb.appendChild(img)}else{const p=document.createElement('div');p.className='processing';p.textContent=item.status==='error'?(item.error||'Processing error'):'Video is still processing…';thumb.appendChild(p)}
 const body=document.createElement('div');body.className='body';body.innerHTML=`<div class="guestrow"><div class="guest"></div><div class="token"></div></div><div class="meta"></div>${item.captionText?'<div class="captioncopy"></div>':''}`;body.querySelector('.guest').textContent=item.guestName||'Guest';body.querySelector('.token').textContent='#'+(item.token||'—');body.querySelector('.meta').textContent=`${duration(item).toFixed(1)}s · ${bytes(item.fileSize)} · ${date(item.createdAt)} · ${item.status}`;if(item.captionText)body.querySelector('.captioncopy').textContent=`Caption: “${item.captionText}”`;
 const row=document.createElement('div');row.className='rowbtn';if(item.hlsUrl)row.appendChild(button('Preview','btn dark small',()=>openSingle(item)));if(item.status==='pending')row.appendChild(button('Approve','btn green small',()=>setStatus(item,'approved')));if(item.status==='approved')row.appendChild(button('Back to Pending','btn outline small',()=>setStatus(item,'pending')));if(!statusProcessing(item)&&item.status!=='rejected')row.appendChild(button('Reject','btn outline small',()=>setStatus(item,'rejected')));row.appendChild(button('Delete','btn red small',()=>deleteItem(item)));body.appendChild(row);
 if(item.status==='approved'&&S.tab==='approved'){const i=approved.findIndex(x=>x.id===item.id),order=document.createElement('div');order.className='order';const up=button('↑','btn outline small',()=>move(i,-1,approved)),down=button('↓','btn outline small',()=>move(i,1,approved));up.disabled=i<=0;down.disabled=i>=approved.length-1;const sp=document.createElement('span');sp.textContent='Playback position '+(i+1);order.append(up,down,sp);body.appendChild(order)}
 c.append(thumb,body);return c}
async function setStatus(item,status){await api(`/api/admin/submissions/${item.id}`,{method:'PATCH',body:JSON.stringify({status})});await refresh()}
async function deleteItem(item){if(!confirm(`Delete ${item.guestName||'this submission'} permanently?`))return;await api(`/api/admin/submissions/${item.id}`,{method:'DELETE'});await refresh()}
async function move(i,d,arr){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];await api('/api/admin/reorder',{method:'POST',body:JSON.stringify({ids:arr.map(x=>x.id)})});await refresh()}

function destroyHls(){if(S.hls){S.hls.destroy();S.hls=null}}
function attachHls(video,url){destroyHls();if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url}else if(Hls.isSupported()){S.hls=new Hls();S.hls.loadSource(url);S.hls.attachMedia(video)}else throw new Error('HLS playback is not supported in this browser.')}
function showPlayer(item,index,total,onEnded){const v=$('queueVideo');$('player').classList.remove('hidden');$('counter').textContent=`${index+1} / ${total} · ${item.guestName||'Guest'}`;attachHls(v,item.hlsUrl);v.onended=onEnded||null;v.play().catch(()=>{})}
function openSingle(item){showPlayer(item,0,1,null)}
$('close').onclick=closePlayer;function closePlayer(){const v=$('queueVideo');v.pause();v.removeAttribute('src');v.load();destroyHls();$('player').classList.add('hidden')}
$('play').onclick=()=>{S.queue=S.items.filter(x=>x.status==='approved'&&x.hlsUrl).sort((a,b)=>(a.sortOrder??99999)-(b.sortOrder??99999));S.qi=0;if(S.queue.length)playQueueItem()};function playQueueItem(){if(S.qi>=S.queue.length){closePlayer();return}const item=S.queue[S.qi];showPlayer(item,S.qi,S.queue.length,()=>{S.qi++;playQueueItem()})}

$('generate300').onclick=async()=>{if(!confirm('Generate 300 new unique 4-character guest codes?'))return;const d=await api('/api/admin/tokens/generate',{method:'POST',body:JSON.stringify({count:300})});S.lastCodes=d.codes||[];$('downloadCodes').classList.toggle('hidden',!S.lastCodes.length);await loadTokenStats();alert(`${S.lastCodes.length} codes generated.`)};
$('downloadCodes').onclick=()=>{const csv='guest_code\n'+S.lastCodes.join('\n')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='WD0501_guest_codes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('resetToken').onclick=async()=>{const code=$('resetCode').value.trim().toUpperCase();if(code.length!==4)return alert('Enter a 4-character code.');if(!confirm(`Reset ${code} so it can be used again?`))return;await api('/api/admin/tokens/reset',{method:'POST',body:JSON.stringify({code})});$('resetCode').value='';await loadTokenStats();alert(`${code} reset.`)};
</script>
</body>
</html>
