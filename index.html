<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ... head content & styles ... -->

  <script type="module">
    // ... Firebase imports & config ...

    window.resetEditor = () => {
      // ...
    };

    //  REPLACE THIS FUNCTION IN YOUR index.html
    window.submitMemory = async () => {
      const captionText = captionActive ? document.getElementById('ig-caption').value.trim() : "";
      const submitBtn = document.getElementById('submit-btn');
      const err = document.getElementById('editor-error');
      const dur = endTime - startTime;

      if (dur < 4.9 || dur > 10.1) {
        err.textContent = translations[currentLang].errDurationRange;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = translations[currentLang].uploading;
      err.textContent = "";

      try {
        const chunkSize = 5 * 1024 * 1024; // 5MB per chunk
        const totalSize = rawFile.size;
        let start = 0;
        let end = Math.min(chunkSize, totalSize);
        const uniqueId = 'upload_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
        let data;

        while (start < totalSize) {
          const chunk = rawFile.slice(start, end);
          const formData = new FormData();
          formData.append("file", chunk);
          formData.append("upload_preset", CLOUDINARY_PRESET);

          const contentRange = `bytes ${start}-${end - 1}/${totalSize}`;
          
          const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`, {
            method: "POST",
            headers: {
              "X-Unique-Upload-Id": uniqueId,
              "Content-Range": contentRange
            },
            body: formData
          });

          data = await response.json();
          if (!response.ok) {
            throw new Error(data.error?.message || `Chunk failed (${response.status})`);
          }

          start = end;
          end = Math.min(start + chunkSize, totalSize);
        }

        if (!data || !data.secure_url) {
          throw new Error("Missing video URL from Cloudinary response");
        }

        await addDoc(collection(db, "memories"), {
          videoUrl: data.secure_url,
          caption: captionText,
          startTime: startTime,
          endTime: endTime,
          token: activeToken,
          status: "pending",
          createdAt: serverTimestamp()
        });

        localStorage.setItem('submitted_' + activeToken, 'true');
        document.getElementById('page-editor').classList.add('hidden');
        document.getElementById('page-thanks').classList.remove('hidden');

      } catch (error) {
        console.error("Submission Error:", error);
        err.textContent = `Upload failed: ${error.message}`;
        submitBtn.disabled = false;
        submitBtn.textContent = translations[currentLang].submitBtn;
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      // ...
    });
  </script>
</head>
