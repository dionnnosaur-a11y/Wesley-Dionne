<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wesley & Dionne | Wedding Memories</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c5a059;
      --gold-dark: #9e7a37;
      --cream-bg: #faf8f3;
      --card-bg: #ffffff;
      --text-dark: #2c2925;
      --text-muted: #6e675f;
      --crimson: #8a1c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--cream-bg); color: var(--text-dark); font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

    .container { background: var(--card-bg); border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 16px; max-width: 480px; width: 100%; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .names-header { font-family: 'Alex Brush', cursive; font-size: 3rem; color: var(--gold-dark); line-height: 1; }
    .xi-symbol { font-size: 2rem; color: var(--crimson); margin: 8px 0; }
    
    .btn { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #fff; font-weight: 600; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; margin-top: 10px; font-size: 0.9rem; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); }

    .token-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--gold); }
    .input-field { width: 80%; padding: 10px; border: 1px solid var(--gold); border-radius: 8px; text-align: center; font-size: 1rem; text-transform: uppercase; margin-bottom: 10px; }

    .video-stage { position: relative; width: 100%; margin: 15px 0; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; max-height: 350px; }
    
    .ig-caption-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
    }
    .ig-caption-overlay::placeholder { color: rgba(255, 255, 255, 0.75); }

    .slider-group { text-align: left; margin: 10px 0; font-size: 0.8rem; color: var(--text-muted); }
    input[type="range"] { width: 100%; accent-color: var(--gold); }
    .hidden { display: none !important; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAIwdjEi2hFRswmY5pGutEnPKes28onoVY",
      authDomain: "wedding-wd0501.firebaseapp.com",
      projectId: "wedding-wd0501",
      storageBucket: "wedding-wd0501.firebasestorage.app",
      messagingSenderId: "502415733371",
      appId: "1:502415733371:web:77817b08a943d348ad68de",
      measurementId: "G-HVEPN86J97"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CLOUDINARY_CLOUD_NAME = "nt2cfrrq";
    const CLOUDINARY_PRESET = "wedding_preset";
    const GUEST_TOKENS = ["WESLEY2026", "DIONNE2026", "GUEST001", "GUEST002", "LOVE888"];

    let activeToken = "";
    let rawFile = null;

    window.showTokenInput = () => {
      document.getElementById('btn-share').classList.add('hidden');
      document.getElementById('token-area').classList.remove('hidden');
    };

    window.validateToken = () => {
      const code = document.getElementById('token-input').value.trim().toUpperCase();
      const err = document.getElementById('token-error');

      if (!GUEST_TOKENS.includes(code)) {
        err.textContent = "Invalid passcode. Please check your invitation.";
        return;
      }
      if (localStorage.getItem('submitted_' + code)) {
        err.textContent = "This token has already been used once.";
        return;
      }

      activeToken = code;
      document.getElementById('page-welcome').classList.add('hidden');
      document.getElementById('page-editor').classList.remove('hidden');
    };

    window.loadVideo = (e) => {
      rawFile = e.target.files[0];
      if (!rawFile) return;

      const vid = document.getElementById('video-preview');
      vid.src = URL.createObjectURL(rawFile);
      vid.onloadedmetadata = () => {
        const dur = Math.floor(vid.duration);
        document.getElementById('start-time').max = dur;
        document.getElementById('end-time').max = dur;
        document.getElementById('start-time').value = 0;
        document.getElementById('end-time').value = Math.min(10, dur);
        window.updateTrim();
        document.getElementById('editor-controls').classList.remove('hidden');
      };
    };

    window.updateTrim = () => {
      const start = parseInt(document.getElementById('start-time').value);
      const end = parseInt(document.getElementById('end-time').value);
      document.getElementById('start-val').textContent = start;
      document.getElementById('end-val').textContent = end;
      
      const diff = end - start;
      const err = document.getElementById('editor-error');
      if (diff < 5 || diff > 10) {
        err.textContent = `Clip is ${diff}s. Must be between 5 and 10 seconds.`;
      } else {
        err.textContent = "";
      }
    };

    window.resetEditor = () => {
      document.getElementById('video-file').value = "";
      document.getElementById('editor-controls').classList.add('hidden');
    };

    window.submitMemory = async () => {
      const start = parseInt(document.getElementById('start-time').value);
      const end = parseInt(document.getElementById('end-time').value);
      const caption = document.getElementById('ig-caption').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const err = document.getElementById('editor-error');

      if ((end - start) < 5 || (end - start) > 10) return;
      if (!rawFile) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading Memory...";
      err.textContent = "";

      try {
        const formData = new FormData();
        formData.append("file", rawFile);
        formData.append("upload_preset", CLOUDINARY_PRESET);

        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        if (!data.secure_url) throw new Error("Upload failed");

        await addDoc(collection(db, "memories"), {
          videoUrl: data.secure_url,
          caption: caption,
          token: activeToken,
          status: "pending",
          createdAt: serverTimestamp()
        });

        localStorage.setItem('submitted_' + activeToken, 'true');
        document.getElementById('page-editor').classList.add('hidden');
        document.getElementById('page-thanks').classList.remove('hidden');

      } catch (error) {
        console.error(error);
        err.textContent = "Upload failed. Please try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Clip";
      }
    };
  </script>
</head>
<body>

  <div class="container">
    
    <!-- STEP 1: WELCOME & TOKEN -->
    <div id="page-welcome">
      <div class="names-header">Wesley & Dionne</div>
      <div class="xi-symbol">囍</div>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">Our Wedding, Through Your Eyes</p>

      <img src="image_0.png" style="width:75%; border-radius:10px; margin-bottom:15px;" alt="Wesley & Dionne">

      <button id="btn-share" class="btn" onclick="showTokenInput()">Share A Memory</button>

      <div id="token-area" class="token-section hidden">
        <input type="text" id="token-input" class="input-field" placeholder="ENTER PASSCODE" maxlength="12">
        <br>
        <button class="btn" onclick="validateToken()">Verify Code</button>
        <div id="token-error" style="color:var(--crimson); font-size:0.8rem; margin-top:8px;"></div>
      </div>
    </div>

    <!-- STEP 2: IG-STYLE VIDEO EDITOR -->
    <div id="page-editor" class="hidden">
      <div class="names-header" style="font-size:2.2rem;">Trim & Caption</div>
      
      <input type="file" id="video-file" accept="video/*" onchange="loadVideo(event)" style="display:none;">
      <button class="btn" style="margin-bottom:10px;" onclick="document.getElementById('video-file').click()">Select Video from Phone</button>

      <div id="editor-controls" class="hidden">
        
        <div class="video-stage">
          <video id="video-preview" controls></video>
          <input type="text" id="ig-caption" class="ig-caption-overlay" placeholder="Type an IG-style caption..." maxlength="80">
        </div>

        <div class="slider-group">
          <label>Start: <span id="start-val">0</span>s | End: <span id="end-val">10</span>s (Select 5–10s)</label>
          <input type="range" id="start-time" min="0" value="0" step="1" oninput="updateTrim()">
          <input type="range" id="end-time" min="5" value="10" step="1" oninput="updateTrim()">
        </div>

        <div>
          <button class="btn btn-secondary" onclick="resetEditor()">Cancel</button>
          <button id="submit-btn" class="btn" onclick="submitMemory()">Submit Clip</button>
        </div>
      </div>
      <div id="editor-error" style="color:var(--crimson); font-size:0.8rem; margin-top:8px;"></div>
    </div>

    <!-- STEP 3: THANK YOU -->
    <div id="page-thanks" class="hidden">
      <div class="xi-symbol" style="font-size:3rem;">囍</div>
      <div class="names-header">Thank You!</div>
      <p style="margin-top:10px; color:var(--text-muted); font-size:0.9rem;">Your clip has been sent to the moderator queue for tonight's reception big screen playback!</p>
    </div>

  </div>

</body>
</html>
